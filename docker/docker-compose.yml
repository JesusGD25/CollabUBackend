services:
  postgres:
    image: postgres:15-alpine
    container_name: collab-u-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-collabu_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-collabu_secret_2025}
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-collabu_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collab-u-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: collab-u-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collab-u-network

  redis:
    image: redis:7-alpine
    container_name: collab-u-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_2025}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collab-u-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  collab-u-network:
    driver: bridge
